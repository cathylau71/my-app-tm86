</style></head><body><main>

<label for="fSt">Status</label><select id="fSt"></select>
<label>Officers to send for training</label><div class="nom" id="nom"></div>
<div id="clash" role="status" aria-live="polite"></div>
<div class="foot"><button class="btn ghost" id="all">Select all listed</button><button class="btn ghost" id="none">Clear</button></div>
<label>Calendar invites (blocks the officers' time once you send them)</label><div class="lk" id="lk"></div>
<p class="m" id="lkn" style="font-size:13px;color:var(--mute);margin:6px 0 0"></p>
<div class="foot"><button class="btn" id="save">Save session</button><button class="btn ghost" id="cancel">Close</button><span class="sp"></span><button class="btn del" id="del">Delete</button></div>
</dialog>
<dialog id="ydlg"><h2 id="yt" style="margin:0 0 8px;font-size:18px"></h2><p id="yp" style="margin:0"></p><div class="foot"><button class="btn" id="yCopy">Copy this year's sessions</button><button class="btn ghost" id="yEmpty">Start empty</button><button class="btn ghost" id="yCancel">Cancel</button></div></dialog>
<dialog id="odlg">

<div class="foot"><button class="btn ghost" id="oAdd">Add past training</button></div>
<div class="foot"><button class="btn" id="oSave">Save profile</button><button class="btn ghost" id="oClose">Close</button></div>
<datalist id="tl"></datalist>
</dialog>
